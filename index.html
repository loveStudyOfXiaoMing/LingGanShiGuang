
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感时光 - AI 个人成长追踪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "lucide-react": "https://esm.sh/lucide-react?external=react",
    "recharts": "https://esm.sh/recharts?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai",
    "react-quill": "https://esm.sh/react-quill@2.0.0?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react/": "https://esm.sh/react@18.2.0/"
  }
}
</script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background-color: #fdfdfb;
            color: #1e293b;
        }
        .serif-text {
            font-family: 'Noto Serif SC', serif;
        }
        /* 自定义编辑器样式 */
        .ql-container.ql-snow {
            border: none !important;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            font-size: 1.1rem;
            height: auto !important; /* 关键：允许容器随内容撑开 */
        }
        .ql-toolbar.ql-snow {
            border: none !important;
            border-bottom: 1px solid #f1f5f9 !important;
            padding: 12px !important;
        }
        .ql-editor {
            min-height: 120px; /* 初始高度调小，约为 3-4 行文字 */
            height: auto !important;
            padding: 24px !important;
            line-height: 1.8;
            overflow-y: hidden; /* 隐藏编辑器内部滚动条，让页面随之增长 */
        }
        .ql-editor.ql-blank::before {
            color: #94a3b8;
            font-style: normal;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
